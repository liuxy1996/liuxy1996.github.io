name: Deploy Python Study Room to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Try to switch Pages to Actions source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Give the legacy Pages build triggered by this push time to finish.
          sleep 50
          get_code=$(curl -sS -o /tmp/pages-before.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          before=$(tr '\n' ' ' < /tmp/pages-before.json | head -c 600)
          echo "Pages GET HTTP ${get_code}: ${before}"
          put_code=$(curl -sS -o /tmp/pages-after.json -w '%{http_code}' -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}')
          after=$(tr '\n' ' ' < /tmp/pages-after.json | head -c 600)
          echo "Pages PUT HTTP ${put_code}: ${after}"
          echo "::warning title=Pages source update::GET ${get_code}; PUT ${put_code}; ${after}"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
